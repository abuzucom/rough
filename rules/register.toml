# Rule register: one decision per Ruff rule. This file is the source of truth.
# status: block (fails CI), warn (reported, never fails), off (not selected; reason required).
# autofix = false keeps `ruff check --fix` away from the rule.
# After editing, run: python scripts/build_config.py

[settings]
line-length = 120
target-version = "py312"
preview = true

[settings.lint.pydocstyle]
convention = "google"

[settings.lint.mccabe]
max-complexity = 10

[settings.lint.pylint]
max-args = 5
max-positional-args = 5
max-statements = 50
max-locals = 15
max-nested-blocks = 5
max-branches = 12
max-returns = 6
max-bool-expr = 5
max-public-methods = 20
max-statements-in-try = 5

[settings.lint.per-file-ignores]
"tests/**" = [
  "any-type",
  "assert",
  "magic-value-comparison",
  "missing-return-type-class-method",
  "missing-return-type-private-function",
  "missing-return-type-special-method",
  "missing-return-type-static-method",
  "missing-return-type-undocumented-public-function",
  "missing-type-args",
  "missing-type-function-argument",
  "missing-type-kwargs",
  "private-member-access",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "undocumented-public-nested-class",
  "undocumented-public-package",
]

[settings.format]
quote-style = "double"
line-ending = "lf"

